name: {ru: Сочетание клавиш, en: Key combination}
# Кнопка-сочетание: нажатие нажимает сочетание клавиш в активном окне, например Win+H —
# голосовой ввод Windows. Сочетание (значение keys) задаётся на странице управления:
# правая кнопка мыши на кнопке → «Настроить кнопку…». Только в Rust-версии.
# Своя подпись (caption) заменяет сочетание; оно тогда мелко под подписью.
label: "{caption|keys|}"
icon: keyboard
# Нажатие — сразу, без ожидания второго: двойное нажатие нажимает сочетание дважды.
eager_click: true
gestures:
  click: [{action: send_keys}]
  # Удержание — как на обычной кнопке: запомнить выделенную сессию; кнопка снова становится
  # кнопкой сессии (сочетание забывается, свой вид остаётся). Сдвинуть палец — перетаскивание.
  hold_start: [{action: read_current_session}]
  hold_end: [{action: bind_held_session}]
  hold_cancel: [{action: forget_held_session}]
