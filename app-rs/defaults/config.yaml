# Настройки по умолчанию, встроенные в exe. Свои значения — в %APPDATA%\Tapswitch\config.yaml:
# там достаточно указать только то, что отличается (разделы сливаются с этими, списки заменяются).
# Сценарий кнопок, которым свой не выбран (id — имя файла сценария).
default_scenario: auto
layout:
  rows: 2  # раскладка для горизонтального экрана; на вертикальном телефоне — наоборот (4×2)
  cols: 4
timing:
  double_click_ms: 300
  hold_ms: 500
  focus_poll_ms: 1000  # как часто искать сессию в фокусе для рамки; 0 — не искать
  status_poll_ms: 2000  # как часто проверять состояние агентов и доступность сессий; 0 — не проверять
web:
  # Панель на телефоне: страница http://<адрес>:<port>/mobile?key=<ключ>.
  port: 3000
  # host: 192.168.1.82  # если адрес в сети определился не тот (VPN, несколько сетей)
dsh:
  # Десктопное приложение DeepSeek Harness: папка его данных (id и названия сессий).
  data: '%USERPROFILE%\.dsh'
browser:
  # Вкладки Chromium-браузеров через расширение (только 127.0.0.1).
  port: 3001
herdr:
  servers:
    - id: windows
      command: [herdr]
      detects_agents: false  # herdr в PowerShell агентов не распознаёт: вместо «нет агента» — «неизвестен»
    - id: wsl
      # Через оболочку входа: herdr обычно лежит в ~/.local/bin, которого нет в PATH у `wsl -e`.
      command: [wsl.exe, -e, sh, -lc, 'exec herdr "$@"', herdr]
