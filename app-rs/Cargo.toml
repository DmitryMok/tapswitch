[package]
name = "tapswitch"
version = "0.1.0"
edition = "2024"
description = "Панель кнопок для сессий ИИ-агентов: трей и веб-интерфейс"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: state.json перезаписывается с прежним порядком полей
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
tray-icon = { version = "0.26.1", default-features = false }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Минимальный размер exe (см. «03 Work/Архитектурная концепция.md»).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
